name: Aggiorna concorsi
on:
  schedule: [{cron: "30 5 * * *"}]   # ogni giorno, 05:30 UTC
  workflow_dispatch:
permissions: {contents: write}
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python scrape.py
      - name: Commit se i dati sono cambiati
        run: |
          git config user.name "concorsi-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/concorsi.json
          git diff --staged --quiet || (git commit -m "Aggiornamento concorsi" && git push)
